<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #1e1e2f;
        }

        .container{
            background: #2c2c54;
            padding: 30px 50px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        h1{
            color: white;
            margin-bottom: 20px;
            font-size: 32px;
        }

        #clock{
            color: #00ff99;
            font-size: 50px;
            font-weight: bold;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Digital Clock</h1>
        <div id="clock">00:00:00</div>
    </div>

    <script>

        const clock = document.querySelector('#clock')

        setInterval(function(){
            clock.innerHTML = new Date().toLocaleTimeString()
        }, 1000)

    </script>

</body>
</html>
