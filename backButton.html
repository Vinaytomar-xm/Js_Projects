
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Back Button</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Back Button Example</h2>
    <p>Click the button to go to the previous page.</p>

    <button onclick="goBack()">Go Back</button>

    <script>
        function goBack() {
            if (history.length > 1) {
                history.back();
            } else {
                alert("No previous page available!");
            }
        }
    </script>

</body>
</html>
